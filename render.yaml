# Render blueprint for schemaver.
#
# Pair with a Postgres you provide — Neon works, and needs no changes here. Set
# SCHEMAVER_DATABASE_URL to its connection string.
#
# Two properties of the free plan to know going in. The service sleeps after
# about fifteen minutes idle and wakes on the next request, so the observation
# loop pauses while it is asleep and drift is detected on the next wake rather
# than continuously. And TLS terminates at Render's proxy, which is why the
# application trusts X-Forwarded-Proto when deciding to mark the session cookie
# Secure.

services:
  - type: web
    name: schemaver
    runtime: docker
    plan: free
    # Keep this close to wherever the database lives; every introspection is a
    # round trip.
    region: singapore

    dockerfilePath: ./Dockerfile
    # No url argument: the metadata connection string comes from the environment,
    # so it can be rotated without editing this file.
    dockerCommand: /schemaver run

    healthCheckPath: /healthz

    envVars:
      # The Postgres schemaver stores its own state in.
      - key: SCHEMAVER_DATABASE_URL
        sync: false

      # Encrypts stored database credentials, and is never written to the
      # database it protects. Generate with:  openssl rand -base64 32
      # Losing it makes every stored credential unrecoverable, so keep a copy.
      - key: SCHEMAVER_ENCRYPTION_KEY
        sync: false

      # Anyone may create an account. Accounts are isolated: a new one sees no
      # server, database or divergence belonging to another.
      #
      # It also means strangers can ask this server to open connections, so with
      # this on, private and link-local addresses are refused — including cloud
      # instance metadata at 169.254.169.254. Remove this key for a closed
      # deployment, where the first account is created with a one-time token
      # printed to the log.
      - key: SCHEMAVER_OPEN_SIGNUP
        value: "1"
