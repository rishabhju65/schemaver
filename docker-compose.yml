# Local schemaver: the application, its metadata database, and a few target
# databases to watch.
#
# One Postgres serves all three roles. That is not a shortcut — schemaver needs
# CREATEDB on its own instance for shadow databases (D-009), so it must have a
# server it administers, and that same server can host demo targets.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: schemaver
      POSTGRES_USER: schemaver
      POSTGRES_DB: schemaver
    ports:
      # Bound to the loopback interface only. Published on 0.0.0.0 this would
      # expose PostgreSQL to the whole network the host sits on — which on a
      # public VM means the internet, with the password in this file.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemaver"]
      interval: 2s
      timeout: 3s
      retries: 30

  schemaver:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Local only. In a real deployment this comes from the environment and is
      # backed up: losing it makes every stored credential unrecoverable.
      SCHEMAVER_ENCRYPTION_KEY: "c2NoZW1hdmVyLWxvY2FsLWRldmVsb3BtZW50LWtleTA="
      SCHEMAVER_ADDR: ":8080"
      # Anyone may create an account. Accounts are isolated from one another.
      SCHEMAVER_OPEN_SIGNUP: "1"
      # Local demo: the seeded target databases are on a private address, so the
      # guard has to be told this deployment is trusted despite open sign-up.
      SCHEMAVER_ALLOW_PRIVATE_TARGETS: "1"
    command: ["run", "postgres://schemaver:schemaver@postgres:5432/schemaver?sslmode=disable"]
    ports:
      - "8080:8080"

volumes:
  pgdata:
