{{define "content"}}
<div class="narrow">
<h1>Sign in</h1>
{{if .Error}}<p class="banner err">{{.Error}}</p>{{end}}
{{if .Demo}}
<p class="banner demo"><b>Demo mode.</b> Sign in as
<code>{{.DemoEmail}}</code> / <code>{{.DemoPassword}}</code>.
This account is read-only — it cannot register a database or store a credential.</p>
{{end}}
<form method="post" action="/login" class="card pad">
  <label>Email<input type="email" name="email" required autofocus
    value="{{if .Demo}}{{.DemoEmail}}{{end}}"></label>
  <label>Password<input type="password" name="password" required
    value="{{if .Demo}}{{.DemoPassword}}{{end}}"></label>
  <button type="submit">Sign in</button>
</form>
</div>
{{end}}
